<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page — Dark/Light Mode</title>
  
  <!-- Inline FOUC Prevention Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const preferredTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', preferredTheme);
    })();
  </script>

  <style>
    /* 1. Theme Color Variables */
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary-color: #3b82f6;
      --primary-hover: #60a5fa;
      --input-bg: #0f172a;
    }

    /* Smooth transitions when theme changes */
    body, header, .login-card, input, button {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    /* Base Styles */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 2. Header & Toggle Layout */
    .login-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      font-weight: 700;
      font-size: 1.25rem;
      text-decoration: none;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Theme Switch Button */
    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      font-size: 0.875rem;
      font-weight: 500;
    }

    .theme-toggle:hover {
      background-color: var(--bg-color);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Show/hide icons based on theme */
    [data-theme="dark"] .sun-icon { display: block; }
    [data-theme="dark"] .moon-icon { display: none; }
    [data-theme="light"] .sun-icon { display: none; }
    [data-theme="light"] .moon-icon { display: block; }

    /* 3. Demo Login Card */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .login-card h2 { margin-top: 0; }
    .login-card p { color: var(--text-muted); margin-bottom: 1.5rem; }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-main);
      box-sizing: border-box;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .nav-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
    }

    .nav-links a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Header with Theme Toggle -->
  <header class="login-header">
    <a href="index.html" class="brand">🥤 AeroDrink</a>
    
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
      <!-- Moon Icon (for Light Mode) -->
      <svg class="moon-icon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <!-- Sun Icon (for Dark Mode) -->
      <svg class="sun-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <span id="themeLabel">Theme</span>
    </button>
  </header>

  <!-- Login Form Container -->
  <main class="login-container">
    <div class="login-card">
      <h2>Welcome Back</h2>
      <p>Please enter your credentials to continue.</p>
      <form onsubmit="handleDemoSubmit(event)">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" value="admin@aerodrink.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" value="••••••••••••" required>
        </div>
        <button type="submit" class="btn-submit">Sign In to Dashboard →</button>
      </form>
      <div class="nav-links">
        <a href="index.html">← Back to 3D Showcase</a>
      </div>
    </div>
  </main>

  <!-- JS Logic -->
  <script>
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    // 1. Determine Initial Theme Preference
    function getPreferredTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        return savedTheme;
      }
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // 2. Apply Theme to Document Root
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      if (themeLabel) {
        themeLabel.textContent = theme === 'dark' ? 'Dark' : 'Light';
      }
    }

    // 3. Initialize Theme on Page Load
    const currentTheme = getPreferredTheme();
    applyTheme(currentTheme);

    // 4. Toggle Event Handler
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const activeTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = activeTheme === 'dark' ? 'light' : 'dark';

        applyTheme(newTheme);
        localStorage.setItem('theme', newTheme);
      });
    }

    // Handle demo submit linking to index.html 3D showcase
    function handleDemoSubmit(e) {
      e.preventDefault();
      window.location.href = 'index.html#dashboard-view';
    }
  </script>
</body>
</html>
